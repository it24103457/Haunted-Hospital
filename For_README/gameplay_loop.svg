<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#777"/>
    </marker>
    <style>
      .box { fill: #ECECFF; stroke: #9370DB; stroke-width: 1.2; }
      .agent { fill: #F4E9E9; stroke: #7a1410; stroke-width: 1.2; }
      .txt { fill: #222; text-anchor: middle; dominant-baseline: middle; }
      .lbl { fill: #333; text-anchor: middle; dominant-baseline: middle; font-size: 12px; }
      .lblbg { fill: #F2F2F2; stroke: #ccc; stroke-width: 0.6; }
      .line { stroke: #777; stroke-width: 1.4; fill: none; }
      .dash { stroke: #777; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
    </style>
  </defs>

  <!-- Main path, top to bottom -->
  <rect class="box" x="415" y="20" width="130" height="40" rx="20"/>
  <text class="txt" x="480" y="40">Wake up</text>
  <path class="line" d="M480,60 L480,188" marker-end="url(#arrow)"/>

  <rect class="box" x="380" y="190" width="200" height="50" rx="4"/>
  <text class="txt" x="480" y="215">Find the 4 code notes</text>
  <path class="line" d="M480,240 L480,328" marker-end="url(#arrow)"/>

  <rect class="box" x="350" y="330" width="260" height="40" rx="4"/>
  <text class="txt" x="480" y="350">Open the elevator with the keypad</text>
  <path class="line" d="M480,370 L480,408" marker-end="url(#arrow)"/>

  <rect class="box" x="400" y="410" width="160" height="40" rx="4"/>
  <text class="txt" x="480" y="430">Find the exit key</text>
  <path class="line" d="M480,450 L480,488" marker-end="url(#arrow)"/>

  <rect class="box" x="425" y="490" width="110" height="40" rx="20"/>
  <text class="txt" x="480" y="510">Escape</text>

  <!-- Agents on the left, each label sitting on its arrow -->
  <rect class="agent" x="20" y="130" width="170" height="40" rx="4"/>
  <text class="txt" x="105" y="150">Item Spawn Director</text>
  <path class="dash" d="M190,150 C290,150 280,205 378,205" marker-end="url(#arrow)"/>
  <rect class="lblbg" x="221" y="161" width="124" height="34" rx="3"/>
  <text class="lbl" x="283" y="171">places supplies,</text>
  <text class="lbl" x="283" y="186">notes and the key</text>

  <rect class="agent" x="20" y="260" width="170" height="40" rx="4"/>
  <text class="txt" x="105" y="280">Sound Hunter</text>
  <path class="dash" d="M190,280 C290,280 280,225 378,225" marker-end="url(#arrow)"/>
  <rect class="lblbg" x="221" y="236" width="124" height="34" rx="3"/>
  <text class="lbl" x="283" y="246">hears your noise</text>
  <text class="lbl" x="283" y="261">and chases you</text>

  <!-- Agents on the right -->
  <rect class="agent" x="770" y="130" width="170" height="40" rx="4"/>
  <text class="txt" x="855" y="150">Resource Thief</text>
  <path class="dash" d="M770,150 C670,150 680,205 582,205" marker-end="url(#arrow)"/>
  <rect class="lblbg" x="615" y="161" width="124" height="34" rx="3"/>
  <text class="lbl" x="677" y="171">steals the supplies</text>
  <text class="lbl" x="677" y="186">you need</text>

  <rect class="agent" x="770" y="260" width="170" height="40" rx="4"/>
  <text class="txt" x="855" y="280">Environment Director</text>
  <path class="dash" d="M770,280 C670,280 680,225 582,225" marker-end="url(#arrow)"/>
  <rect class="lblbg" x="615" y="236" width="124" height="34" rx="3"/>
  <text class="lbl" x="677" y="246">scares that</text>
  <text class="lbl" x="677" y="261">drain sanity</text>

  <!-- Failure branch -->
  <path class="line" d="M550,240 C555,330 760,360 770,468" marker-end="url(#arrow)"/>
  <rect class="lblbg" x="640" y="370" width="150" height="22" rx="3"/>
  <text class="lbl" x="715" y="381">health or sanity runs out</text>
  <rect class="box" x="670" y="470" width="200" height="40" rx="20"/>
  <text class="txt" x="770" y="490">Start again from Wake up</text>
</svg>
